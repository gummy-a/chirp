openapi: 3.0.3
info:
  title: メディアAPI
  version: 0.1.0
  description: メディアアップロードや情報の取得を行うAPI

# ========================================================================
# 全APIでAuthorization: Bearer必須とする
# ========================================================================
security:
  - bearerAuth: [] 

paths:

# ========================================================================
# ファイルアップロード
# ========================================================================
  /api/media/v1/upload/:
    post:
      summary: 複数ファイルを同時にアップロードする
      description: |-
        画像または動画ファイルをユーザー情報と同時にアップロードします。
        ファイルのアップロードが完了したら一旦200OKを返します。
        そのあとencode serviceにファイルを引き渡し、エンコードします。
        エンコードはffmpegで下記を実施します。

        画像は長辺を2000pxになるよう縮小する
        画像サイズに関わらず、quality 75でwebpに圧縮する
        動画は長辺を720pxになるよう縮小する
        動画はcrf 25で圧縮する
        画像は3MB, 動画は10MB以上を弾く
      requestBody:
        content:
          multipart/form-data:
            schema: 
              type: object
              properties:
                files:
                  description: アップロードするファイル群
                  type: array
                  items:
                    type: string
                    format: binary

      responses:
        '202': # 全てのファイルが適合だった場合のみ202を返す, 1つでもエラーなら4xxを返す
          description: アップロードを待ち行列に追加した(処理中)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    job_id:
                      type: string
                      description: 処理中を受け付けたファイルのjobid

        '400':
          description: ファイルが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
# ========================================================================
# エンコード進捗通知 (SSE)
# ========================================================================
  /api/media/v1/upload/events/{job_id}/:
    get:
      summary: エンコード進捗をリアルタイム通知する (SSE)
      description: |-
        指定した job_id のエンコード進捗を Server-Sent Events で配信します。
        `data: {"status": "processing", "progress": 50}`
        `data: {"status": "completed", "fileUrl": "..."}`
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE接続確立
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/UploadProgressEvent'
        '404':
          description: 指定されたジョブが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
# ------------------------------------------------------------------------
# components
# ------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
# ------------------------------------------------------------------------
# SSEで流すJSONの定義
# ------------------------------------------------------------------------
    UploadProgressEvent:
      type: object
      properties:
        status:
          type: string
          enum: [processing, completed, error]
          description: 現在の状態
        media_id:
          type: string
          description: 完了時に付与されるファイルID
        message:
          type: string
          description: エラー時のメッセージ等
      required:
        - status
# ------------------------------------------------------------------------
# ------------------------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: エラーコード
          example: "UNAUTHORIZED"
        message:
          type: string
          description: エラーの詳細内容
          example: "メールアドレスまたはパスワードが正しくありません。"